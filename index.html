<body>

    <audio id="charger-sound" src="tap.mp3" preload="auto"></audio>

    <header>
        <div class="header-top">
            <div class="header-title">
                <span id="online-dot"></span>
                <h1>🖥️ IT Help Desk</h1>
            </div>
            <span id="clock"></span>
        </div>
        <div class="header-bottom">
            <div class="header-bottom-left" id="last-tap">No taps yet today</div>
            <span id="unsynced-badge"></span>
        </div>
    </header>

    <div class="grid" id="grid"></div>

    <div class="bottom-bar">
        <div class="total-bar">
            <span class="total-bar-label">Today's Total</span>
            <span class="total-bar-count" id="total-count">0</span>
        </div>
        <button class="bottom-btn export-btn" onclick="exportCSV()">⬇ Export</button>
        <button type="button" class="bottom-btn sync-btn" onclick="syncNow()">↻ Sync</button>
        <button class="bottom-btn reset-btn" onclick="hardReset()">🗑 Clear</button>
    </div>

    <div id="status-bar"></div>

    <script>
        // ─── CONFIG ───────────────────────────────────────────────
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykAAK8KBTqwHm353ZPZPGws6E2lgH0mt0-1H6rUYvGT-JTCHFhBmEpcZbpnhzL1uEY/exec";

        const SHEET_SYNC_LOCK = "it-counter-sheet-sync";

        function newEventId() {
            if (crypto.randomUUID) return crypto.randomUUID();
            return Date.now() + "-" + Math.random().toString(36).slice(2, 12);
        }

        const categories = [
            { label: "Walk Ups", color: "#3b82f6" },
            { label: "Phone Calls", color: "#14b8a6" },
            { label: "Printer Issues", color: "#f97316" },
            { label: "General Questions", color: "#a855f7" },
            { label: "4410 Hotline Call", color: "#ef4444" },
            { label: "3D Printing", color: "#22c55e" },
            { label: "Digital Requests", color: "#0ea5e9" },
            { label: "Zoom Assistance", color: "#6366f1" },
            { label: "Video Requests", color: "#ec4899" },
            { label: "Charger", color: "#f59e0b" },
        ];

        let log = JSON.parse(localStorage.getItem("itLog")) || [];
        let counts = JSON.parse(localStorage.getItem("itCounts")) || {};
        categories.forEach(c => { if (counts[c.label] === undefined) counts[c.label] = 0; });
        let migratedIds = false;
        for (let i = 0; i < log.length; i++) {
            if (!log[i].id) { log[i].id = newEventId(); migratedIds = true; }
        }
        if (migratedIds) save();

        function save() {
            localStorage.setItem("itLog", JSON.stringify(log));
            localStorage.setItem("itCounts", JSON.stringify(counts));
        }

        function nowStrs() {
            const d = new Date();
            return {
                date: d.toLocaleDateString("en-US"),
                time: d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: true })
            };
        }

        function today() {
            return new Date().toLocaleDateString("en-US");
        }

        // ─── SOUND: Charger only ──────────────────────────────────
        function playChargerSound() {
            const sound = document.getElementById("charger-sound");
            sound.currentTime = 0;
            sound.play().catch(() => { });
        }

        // ─── RENDER GRID ─────────────────────────────────────────
        function renderGrid() {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";
            categories.forEach(cat => {
                const id = cat.label.replace(/\s+/g, "_");
                const card = document.createElement("div");
                card.className = "card";
                card.id = "card-" + id;
                card.innerHTML = `
                    <div class="card-top">
                        <span class="card-label">${cat.label}</span>
                        <button class="undo-btn" onclick="undo('${cat.label}')">↩ Undo</button>
                    </div>
                    <div class="card-count" id="count-${id}" style="color:${cat.color}">
                        ${counts[cat.label]}
                    </div>
                    <button class="tap-btn" style="background:${cat.color}"
                        onclick="increment('${cat.label}', '${id}')">+ 1</button>
                    <button class="note-toggle" id="toggle-${id}"
                        onclick="toggleNote('${id}')">＋ Add note to last tap</button>
                    <textarea class="note-input" id="note-${id}"
                        placeholder="Note for last tap..."
                        onblur="attachNote('${cat.label}', '${id}')"></textarea>
                `;
                grid.appendChild(card);
            });
            renderTotal();
        }

        // ─── INCREMENT ───────────────────────────────────────────
        function increment(label, id) {
            if (label === "Charger") playChargerSound();
            const { date, time } = nowStrs();
            counts[label]++;
            log.push({ id: newEventId(), label, date, time, note: "", pushed: false });
            save();
            document.getElementById("count-" + id).textContent = counts[label];
            renderTotal();
            updateLastTap(label, time);
            updateUnsyncedBadge();
            flashCard(id);
            const noteEl = document.getElementById("note-" + id);
            noteEl.value = "";
            noteEl.classList.remove("open");
            document.getElementById("toggle-" + id).textContent = "＋ Add note to last tap";
        }

        function flashCard(id) {
            const card = document.getElementById("card-" + id);
            card.classList.add("flash");
            setTimeout(() => card.classList.remove("flash"), 200);
        }

        function updateLastTap(label, time) {
            const cat = categories.find(c => c.label === label);
            document.getElementById("last-tap").innerHTML =
                `Last: <span style="color:${cat.color}">${label}</span> &nbsp;·&nbsp; ${time}`;
        }

        // ─── UNSYNCED BADGE ──────────────────────────────────────
        function updateUnsyncedBadge() {
            const count = log.filter(e => !e.pushed).length;
            const badge = document.getElementById("unsynced-badge");
            if (count > 0) {
                badge.textContent = `⏳ ${count} unsynced`;
                badge.style.display = "inline";
            } else {
                badge.style.display = "none";
            }
        }

        // ─── UNDO ────────────────────────────────────────────────
        function undo(label) {
            if (counts[label] <= 0) return;
            for (let i = log.length - 1; i >= 0; i--) {
                if (log[i].label === label && !log[i].pushed) {
                    log.splice(i, 1);
                    break;
                }
            }
            counts[label]--;
            save();
            const id = label.replace(/\s+/g, "_");
            document.getElementById("count-" + id).textContent = counts[label];
            renderTotal();
            updateUnsyncedBadge();
        }

        // ─── NOTE ────────────────────────────────────────────────
        function toggleNote(id) {
            const noteEl = document.getElementById("note-" + id);
            const toggleEl = document.getElementById("toggle-" + id);
            const isOpen = noteEl.classList.contains("open");
            if (isOpen) {
                noteEl.classList.remove("open");
                toggleEl.textContent = "＋ Add note to last tap";
            } else {
                noteEl.classList.add("open");
                toggleEl.textContent = "− Hide note";
                noteEl.focus();
            }
        }

        function attachNote(label, id) {
            const text = document.getElementById("note-" + id).value.trim();
            if (!text) return;
            for (let i = log.length - 1; i >= 0; i--) {
                if (log[i].label === label && !log[i].pushed) {
                    log[i].note = text;
                    save();
                    break;
                }
            }
        }

        // ─── TOTAL ───────────────────────────────────────────────
        function renderTotal() {
            const total = categories.reduce((sum, c) => sum + counts[c.label], 0);
            document.getElementById("total-count").textContent = total;
        }

        // ─── EXPORT CSV ──────────────────────────────────────────
        function exportCSV() {
            if (log.length === 0) { setStatus("No data to export yet.", "error"); return; }
            const todayStr = new Date().toLocaleDateString("en-US").replace(/\//g, "-");
            let csv = "Date,Time,Category,Note\n";
            log.forEach(e => {
                const note = (e.note || "").replace(/"/g, '""');
                csv += `"${e.date}","${e.time}","${e.label}","${note}"\n`;
            });
            csv += "\nSummary\nCategory,Total\n";
            categories.forEach(c => { csv += `"${c.label}",${counts[c.label]}\n`; });
            const total = categories.reduce((sum, c) => sum + counts[c.label], 0);
            csv += `"TOTAL",${total}\n`;
            const blob = new Blob([csv], { type: "text/csv" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = `IT_Log_${todayStr}.csv`; a.click();
            URL.revokeObjectURL(url);
        }

        // ─── PUSH TO SHEET ───────────────────────────────────────
        // no-cors: cannot read response; duplicate POSTs are avoided by Web Locks (cross-tab).
        // Each row has a stable `id` so Apps Script can skip duplicates if you add a check there.
        async function pushToSheetBody() {
            const unpushed = log.filter(e => !e.pushed);
            if (unpushed.length === 0) return true;
            setStatus("Syncing...", "");
            try {
                const params = new URLSearchParams();
                params.append("data", JSON.stringify(unpushed));
                await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    body: params
                });
                log.forEach(e => { if (!e.pushed) e.pushed = true; });
                save();
                setStatus("Synced ✓", "success");
                updateUnsyncedBadge();
                return true;
            } catch {
                setStatus("Sync failed — will retry in 5 min", "error");
                return false;
            }
        }

        async function pushToSheet() {
            if (navigator.locks && navigator.locks.request) {
                return navigator.locks.request(SHEET_SYNC_LOCK, pushToSheetBody);
            }
            return pushToSheetBody();
        }

        async function syncNow() {
            if (!log.some(e => !e.pushed)) {
                setStatus("Nothing to sync — no unsynced rows.", "");
                return;
            }
            await pushToSheet();
        }

        // ─── HARD RESET ──────────────────────────────────────────
        function hardReset() {
            const confirmed = confirm(
                "This will clear ALL data and local storage.\nUse only if something is broken.\n\nAre you sure?"
            );
            if (!confirmed) return;
            localStorage.clear();
            log = []; counts = {};
            categories.forEach(c => counts[c.label] = 0);
            save(); renderGrid();
            document.getElementById("last-tap").textContent = "No taps yet today";
            updateUnsyncedBadge();
            setStatus("All data cleared.", "success");
        }

        // ─── MIDNIGHT RESET ──────────────────────────────────────
        function msUntilMidnight() {
            const now = new Date();
            const midnight = new Date(now);
            midnight.setHours(24, 0, 0, 0);
            return midnight - now;
        }

        async function midnightReset() {
            const success = await pushToSheet();
            if (success) {
                log = [];
                categories.forEach(c => counts[c.label] = 0);
                save(); renderGrid();
                localStorage.setItem("itLastResetDate", today());
                document.getElementById("last-tap").textContent = "No taps yet today";
                updateUnsyncedBadge();
                setStatus("New day started ✓", "success");
                scheduleMidnight();
            } else {
                setStatus("Reset pending — retrying in 5 min...", "error");
                setTimeout(midnightReset, 5 * 60 * 1000);
            }
        }

        function scheduleMidnight() { setTimeout(midnightReset, msUntilMidnight()); }

        // ─── MISSED MIDNIGHT DETECTION ───────────────────────────
        // Fires on load and whenever the tab/app comes back into focus.
        function primeLastResetDateIfNeeded() {
            if (localStorage.getItem("itLastResetDate")) return;
            if (log.length > 0) return;
            localStorage.setItem("itLastResetDate", today());
        }

        function shouldCatchUpMissedMidnight() {
            const t = today();
            const lastReset = localStorage.getItem("itLastResetDate");
            if (lastReset && lastReset !== t) return true;
            if (!lastReset && log.length > 0 && log.some(e => e.date !== t)) return true;
            return false;
        }

        async function checkMissedReset() {
            primeLastResetDateIfNeeded();
            if (!shouldCatchUpMissedMidnight()) return;
            setStatus("Missed midnight reset — catching up...", "");
            await midnightReset();
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") checkMissedReset();
        });

        // ─── ONLINE INDICATOR ────────────────────────────────────
        function updateOnline() {
            document.getElementById("online-dot").classList.toggle("offline", !navigator.onLine);
        }
        window.addEventListener("online", updateOnline);
        window.addEventListener("offline", updateOnline);

        // ─── STATUS BAR ──────────────────────────────────────────
        function setStatus(msg, type) {
            const el = document.getElementById("status-bar");
            el.textContent = msg; el.className = type;
            if (type === "success") setTimeout(() => { el.textContent = ""; el.className = ""; }, 4000);
        }

        // ─── CLOCK ───────────────────────────────────────────────
        function updateClock() {
            document.getElementById("clock").textContent =
                new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
        }

        // ─── INIT ────────────────────────────────────────────────
        renderGrid();
        updateUnsyncedBadge();
        primeLastResetDateIfNeeded();
        scheduleMidnight();
        updateClock();
        updateOnline();
        setInterval(updateClock, 30000);
        // On load: check for missed midnight, then push anything still pending
        (async () => {
            await checkMissedReset();
            if (log.some(e => !e.pushed)) await pushToSheet();
        })();
    </script>
</body>

            transform: scale(0.95);
            opacity: 0.75;
        }

        .note-toggle {
            background: none;
            border: none;
            font-size: 0.75rem;
            color: #475569;
            cursor: pointer;
            text-align: left;
            padding: 0;
        }

        .note-toggle:active {
            color: #64748b;
        }

        .note-input {
            display: none;
            width: 100%;
            border: 1.5px solid #334155;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-family: inherit;
            color: #f1f5f9;
            background: #0f172a;
            resize: none;
            min-height: 65px;
        }

        .note-input.open {
            display: block;
        }

        .note-input::placeholder {
            color: #475569;
        }

        .bottom-bar {
            display: flex;
            gap: 10px;
            align-items: stretch;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .total-bar {
            background: #1e293b;
            border-radius: 16px;
            padding: 16px 20px;
            flex: 1;
            min-width: 210px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .total-bar-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .total-bar-count {
            font-size: 2.4rem;
            font-weight: 900;
            color: #f1f5f9;
            letter-spacing: -1px;
        }

        .bottom-btn {
            border: none;
            border-radius: 16px;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 0 18px;
            min-height: 62px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
            transition: opacity 0.1s;
        }

        .bottom-btn:active {
            opacity: 0.75;
        }

        .export-btn {
            background: #0f766e;
            color: #ccfbf1;
        }

        .sync-btn {
            background: #1d4ed8;
            color: #dbeafe;
        }

        .reset-btn {
            background: #1e293b;
            color: #475569;
            border: 1.5px solid #334155;
            font-size: 0.75rem;
            padding: 0 14px;
        }

        .reset-btn:active {
            background: #334155;
        }

        #status-bar {
            text-align: center;
            font-size: 0.78rem;
            color: #475569;
            min-height: 18px;
        }

        #status-bar.error {
            color: #ef4444;
        }

        #status-bar.success {
            color: #10b981;
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.94);
            color: #f8fafc;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        #loading-overlay.open {
            display: flex;
        }

        .loading-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 28px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .loading-spinner {
            width: 46px;
            height: 46px;
            border: 5px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            margin: 0 auto 18px;
            animation: spin 0.9s linear infinite;
        }

        .loading-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .loading-message {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.45;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        body.app-locked button,
        body.app-locked textarea {
            pointer-events: none;
            opacity: 0.55;
        }
    </style>
</head>

<body>
    <div id="loading-overlay">
        <div class="loading-card">
            <div class="loading-spinner"></div>
            <div class="loading-title" id="loading-title">Syncing…</div>
            <div class="loading-message" id="loading-message">
                Please wait while the counter saves pending entries.
            </div>
        </div>
    </div>

    <audio id="charger-sound" src="tap.mp3" preload="auto"></audio>

    <header>
        <div class="header-top">
            <div class="header-title">
                <span id="online-dot"></span>
                <h1>🖥️ IT Help Desk</h1>
            </div>
            <span id="clock"></span>
        </div>

        <div class="header-bottom">
            <div class="header-bottom-left" id="last-tap">No taps yet today</div>
            <span id="unsynced-badge"></span>
        </div>
    </header>

    <div class="grid" id="grid"></div>

    <div class="bottom-bar">
        <div class="total-bar">
            <span class="total-bar-label">Today's Total</span>
            <span class="total-bar-count" id="total-count">0</span>
        </div>

        <button class="bottom-btn export-btn" onclick="exportCSV()">⬇ Export</button>
        <button class="bottom-btn sync-btn" onclick="manualSync()">↻ Test Sync</button>
        <button class="bottom-btn reset-btn" onclick="hardReset()">🗑 Clear</button>
    </div>

    <div id="status-bar"></div>

    <script>
        // ─── CONFIG ───────────────────────────────────────────────
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyynurcdsEq2O-BKg-laG-0X33gHF7iZGpcbXqw-12sapq6fFHA2bpL8BLAWfdtZg9H/exec"

        const DEVICE_ID = "helpdesk-ipad-1";
        const MANUAL_SYNC_PASSWORD = "1234";
        const SHEET_SYNC_LOCK = "it-counter-sheet-sync";

        // 30 minutes
        const AUTO_SYNC_INTERVAL_MS = 30 * 60 * 1000;

        // If missed-midnight sync fails, retry every 5 minutes.
        const CRITICAL_RETRY_MS = 5 * 60 * 1000;

        // Keep old synced rows locally for backup/recovery.
        const LOCAL_RETENTION_DAYS = 14;

        const categories = [
            { label: "Walk Ups", color: "#3b82f6" },
            { label: "Phone Calls", color: "#14b8a6" },
            { label: "Printer Issues", color: "#f97316" },
            { label: "General Questions", color: "#a855f7" },
            { label: "4410 Hotline Call", color: "#ef4444" },
            { label: "3D Printing", color: "#22c55e" },
            { label: "Digital Requests", color: "#0ea5e9" },
            { label: "Zoom Assistance", color: "#6366f1" },
            { label: "Video Requests", color: "#ec4899" },
            { label: "Charger", color: "#f59e0b" },
        ];

        let log = safeReadJson("itLog", []);
        let counts = safeReadJson("itCounts", {});
        let isSyncing = false;
        let isCriticalSync = false;

        categories.forEach(c => {
            if (counts[c.label] === undefined) {
                counts[c.label] = 0;
            }
        });

        migrateOldEntries();
        rebuildCountsForToday();
        save();

        function safeReadJson(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return fallback;
                return JSON.parse(raw);
            } catch {
                return fallback;
            }
        }

        function save() {
            localStorage.setItem("itLog", JSON.stringify(log));
            localStorage.setItem("itCounts", JSON.stringify(counts));
        }

        function newEventId() {
            if (window.crypto && crypto.randomUUID) {
                return crypto.randomUUID();
            }

            return (
                Date.now().toString(36) +
                "-" +
                Math.random().toString(36).slice(2, 12)
            );
        }

        function migrateOldEntries() {
            let changed = false;

            log.forEach(entry => {
                if (!entry.id) {
                    entry.id = newEventId();
                    changed = true;
                }

                if (!entry.deviceId) {
                    entry.deviceId = DEVICE_ID;
                    changed = true;
                }

                if (entry.pushed === undefined) {
                    entry.pushed = false;
                    changed = true;
                }

                if (!entry.createdAt) {
                    entry.createdAt = new Date().toISOString();
                    changed = true;
                }

                if (entry.syncedAt === undefined) {
                    entry.syncedAt = null;
                    changed = true;
                }
            });

            if (changed) {
                save();
            }
        }

        function nowStrs() {
            const d = new Date();

            return {
                date: d.toLocaleDateString("en-US"),
                time: d.toLocaleTimeString("en-US", {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: true
                })
            };
        }

        function today() {
            return new Date().toLocaleDateString("en-US");
        }

        function parseLocalDate(dateStr) {
            const d = new Date(dateStr);
            return Number.isNaN(d.getTime()) ? null : d;
        }

        // ─── LOCAL COUNTS ─────────────────────────────────────────
        function rebuildCountsForToday() {
            const todayStr = today();

            counts = {};
            categories.forEach(c => {
                counts[c.label] = 0;
            });

            log.forEach(entry => {
                if (
                    entry.date === todayStr &&
                    counts[entry.label] !== undefined
                ) {
                    counts[entry.label]++;
                }
            });
        }

        function pruneOldSyncedRows() {
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - LOCAL_RETENTION_DAYS);

            const before = log.length;

            log = log.filter(entry => {
                if (!entry.pushed) return true;

                const createdAt = entry.createdAt
                    ? new Date(entry.createdAt)
                    : parseLocalDate(entry.date);

                if (!createdAt || Number.isNaN(createdAt.getTime())) {
                    return true;
                }

                return createdAt >= cutoff;
            });

            if (log.length !== before) {
                save();
            }
        }

        // ─── SOUND: Charger only ──────────────────────────────────
        function playChargerSound() {
            const sound = document.getElementById("charger-sound");

            if (!sound) return;

            sound.currentTime = 0;
            sound.play().catch(() => { });
        }

        // ─── RENDER GRID ─────────────────────────────────────────
        function renderGrid() {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";

            categories.forEach(cat => {
                const id = cat.label.replace(/\s+/g, "_");
                const card = document.createElement("div");

                card.className = "card";
                card.id = "card-" + id;

                card.innerHTML = `
                    <div class="card-top">
                        <span class="card-label">${cat.label}</span>
                        <button class="undo-btn" onclick="undo('${cat.label}')">↩ Undo</button>
                    </div>

                    <div class="card-count" id="count-${id}" style="color:${cat.color}">
                        ${counts[cat.label]}
                    </div>

                    <button class="tap-btn" style="background:${cat.color}"
                        onclick="increment('${cat.label}', '${id}')">+ 1</button>

                    <button class="note-toggle" id="toggle-${id}"
                        onclick="toggleNote('${id}')">＋ Add note to last tap</button>

                    <textarea class="note-input" id="note-${id}"
                        placeholder="Note for last tap..."
                        onblur="attachNote('${cat.label}', '${id}')"></textarea>
                `;

                grid.appendChild(card);
            });

            renderTotal();
        }

        // ─── INCREMENT ───────────────────────────────────────────
        function increment(label, id) {
            if (isCriticalSync) return;

            if (label === "Charger") {
                playChargerSound();
            }

            const { date, time } = nowStrs();

            counts[label]++;

            log.push({
                id: newEventId(),
                deviceId: DEVICE_ID,
                label,
                date,
                time,
                note: "",
                pushed: false,
                createdAt: new Date().toISOString(),
                syncedAt: null
            });

            save();

            document.getElementById("count-" + id).textContent = counts[label];

            renderTotal();
            updateLastTap(label, time);
            updateUnsyncedBadge();
            flashCard(id);

            const noteEl = document.getElementById("note-" + id);
            noteEl.value = "";
            noteEl.classList.remove("open");

            document.getElementById("toggle-" + id).textContent =
                "＋ Add note to last tap";
        }

        function flashCard(id) {
            const card = document.getElementById("card-" + id);
            card.classList.add("flash");

            setTimeout(() => {
                card.classList.remove("flash");
            }, 200);
        }

        function updateLastTap(label, time) {
            const cat = categories.find(c => c.label === label);

            document.getElementById("last-tap").innerHTML =
                `Last: <span style="color:${cat.color}">${label}</span> &nbsp;·&nbsp; ${time}`;
        }

        // ─── UNSYNCED BADGE ──────────────────────────────────────
        function updateUnsyncedBadge() {
            const count = log.filter(e => !e.pushed).length;
            const badge = document.getElementById("unsynced-badge");

            if (count > 0) {
                badge.textContent = `⏳ ${count} unsynced`;
                badge.style.display = "inline";
            } else {
                badge.style.display = "none";
            }
        }

        // ─── UNDO ────────────────────────────────────────────────
        function undo(label) {
            if (isCriticalSync) return;

            for (let i = log.length - 1; i >= 0; i--) {
                if (log[i].label === label && !log[i].pushed) {
                    log.splice(i, 1);

                    counts[label] = Math.max(0, counts[label] - 1);

                    save();

                    const id = label.replace(/\s+/g, "_");

                    document.getElementById("count-" + id).textContent =
                        counts[label];

                    renderTotal();
                    updateUnsyncedBadge();
                    setStatus("Last unsynced " + label + " tap removed.", "success");

                    return;
                }
            }

            setStatus("Nothing unsynced to undo for " + label + ".", "error");
        }

        // ─── NOTE ────────────────────────────────────────────────
        function toggleNote(id) {
            if (isCriticalSync) return;

            const noteEl = document.getElementById("note-" + id);
            const toggleEl = document.getElementById("toggle-" + id);
            const isOpen = noteEl.classList.contains("open");

            if (isOpen) {
                noteEl.classList.remove("open");
                toggleEl.textContent = "＋ Add note to last tap";
            } else {
                noteEl.classList.add("open");
                toggleEl.textContent = "− Hide note";
                noteEl.focus();
            }
        }

        function attachNote(label, id) {
            if (isCriticalSync) return;

            const text = document.getElementById("note-" + id).value.trim();

            if (!text) return;

            for (let i = log.length - 1; i >= 0; i--) {
                if (log[i].label === label && !log[i].pushed) {
                    log[i].note = text;
                    save();
                    break;
                }
            }
        }

        // ─── TOTAL ───────────────────────────────────────────────
        function renderTotal() {
            const total = categories.reduce((sum, c) => {
                return sum + counts[c.label];
            }, 0);

            document.getElementById("total-count").textContent = total;
        }

        // ─── EXPORT CSV ──────────────────────────────────────────
        function exportCSV() {
            if (isCriticalSync) return;

            const todayStrForFilter = today();
            const todayRows = log.filter(e => e.date === todayStrForFilter);

            if (todayRows.length === 0) {
                setStatus("No data to export yet.", "error");
                return;
            }

            const todayStr = new Date()
                .toLocaleDateString("en-US")
                .replace(/\//g, "-");

            let csv = "Event ID,Date,Time,Category,Note,Pushed,Synced At,Device ID\n";

            todayRows.forEach(e => {
                const note = (e.note || "").replace(/"/g, '""');

                csv += `"${e.id}","${e.date}","${e.time}","${e.label}","${note}","${e.pushed ? "yes" : "no"}","${e.syncedAt || ""}","${e.deviceId || ""}"\n`;
            });

            csv += "\nSummary\nCategory,Total\n";

            categories.forEach(c => {
                csv += `"${c.label}",${counts[c.label]}\n`;
            });

            const total = categories.reduce((sum, c) => {
                return sum + counts[c.label];
            }, 0);

            csv += `"TOTAL",${total}\n`;

            const blob = new Blob([csv], { type: "text/csv" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");

            a.href = url;
            a.download = `IT_Log_${todayStr}.csv`;
            a.click();

            URL.revokeObjectURL(url);
        }

        // ─── SYNC ────────────────────────────────────────────────
        async function pushToSheetBody(options = {}) {
            const critical = options.critical === true;

            if (isSyncing) {
                return false;
            }

            const unpushed = log.filter(e => !e.pushed);

            if (unpushed.length === 0) {
                updateUnsyncedBadge();
                return true;
            }

            isSyncing = true;

            if (critical) {
                setCriticalSync(
                    true,
                    "Starting new day…",
                    "Syncing pending entries first. Please wait."
                );
            } else {
                setStatus(`Syncing ${unpushed.length} row(s)...`, "");
            }

            try {
                const params = new URLSearchParams();
                params.append("data", JSON.stringify(unpushed));

                await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    body: params
                });

                const sentIds = new Set(unpushed.map(e => e.id));
                const syncedAt = new Date().toISOString();

                log.forEach(entry => {
                    if (sentIds.has(entry.id)) {
                        entry.pushed = true;
                        entry.syncedAt = syncedAt;
                    }
                });

                save();
                updateUnsyncedBadge();

                localStorage.setItem("itLastSyncAttempt", syncedAt);

                if (!critical) {
                    setStatus(`Sync attempted ✓ ${unpushed.length} row(s)`, "success");
                }

                return true;

            } catch (err) {
                if (!critical) {
                    setStatus("Sync failed — will retry automatically.", "error");
                }

                return false;

            } finally {
                isSyncing = false;
            }
        }

        async function pushToSheet(options = {}) {
            if (navigator.locks && navigator.locks.request) {
                return navigator.locks.request(SHEET_SYNC_LOCK, () => {
                    return pushToSheetBody(options);
                });
            }

            return pushToSheetBody(options);
        }

        async function manualSync() {
            if (isCriticalSync) return;

            const password = prompt("Enter manual sync password:");

            if (password === null) {
                return;
            }

            if (password !== MANUAL_SYNC_PASSWORD) {
                setStatus("Incorrect password. Manual sync cancelled.", "error");
                return;
            }

            if (!navigator.onLine) {
                setStatus("Cannot sync while offline.", "error");
                return;
            }

            if (!log.some(e => !e.pushed)) {
                setStatus("Nothing to sync — no unsynced rows.", "");
                return;
            }

            setCriticalSync(
                true,
                "Manual test sync…",
                "Sending pending entries to Google Sheets."
            );

            const success = await pushToSheet({
                reason: "manual-test",
                critical: false
            });

            setCriticalSync(false);

            if (success) {
                setStatus("Manual sync attempted ✓", "success");
            } else {
                setStatus("Manual sync failed — will retry automatically.", "error");
            }
        }

        function startAutoSync() {
            setInterval(async () => {
                if (isCriticalSync) return;
                if (!navigator.onLine) return;
                if (!log.some(e => !e.pushed)) return;

                await pushToSheet({
                    reason: "interval"
                });
            }, AUTO_SYNC_INTERVAL_MS);
        }

        // ─── HARD RESET ──────────────────────────────────────────
        function hardReset() {
            if (isCriticalSync) return;

            const confirmed = confirm(
                "This will clear this app's local counter data on this iPad.\nUse only if something is broken.\n\nAre you sure?"
            );

            if (!confirmed) return;

            localStorage.removeItem("itLog");
            localStorage.removeItem("itCounts");
            localStorage.removeItem("itLastResetDate");
            localStorage.removeItem("itLastSyncAttempt");

            log = [];
            counts = {};

            categories.forEach(c => {
                counts[c.label] = 0;
            });

            save();
            renderGrid();

            document.getElementById("last-tap").textContent = "No taps yet today";

            updateUnsyncedBadge();
            setStatus("Local counter data cleared.", "success");
        }

        // ─── MIDNIGHT RESET ──────────────────────────────────────
        function msUntilMidnight() {
            const now = new Date();
            const midnight = new Date(now);

            midnight.setHours(24, 0, 0, 0);

            return midnight - now;
        }

        function scheduleMidnight() {
            setTimeout(() => {
                runNewDayReset({
                    reason: "midnight",
                    critical: true
                });
            }, msUntilMidnight());
        }

        async function runNewDayReset(options = {}) {
            const critical = options.critical !== false;

            isCriticalSync = critical;

            if (critical) {
                setCriticalSync(
                    true,
                    "Starting new day…",
                    "Syncing pending entries before resetting the counter."
                );
            }

            const success = await pushToSheet({
                critical,
                reason: options.reason || "new-day-reset"
            });

            if (success) {
                localStorage.setItem("itLastResetDate", today());

                rebuildCountsForToday();
                pruneOldSyncedRows();
                save();
                renderGrid();

                document.getElementById("last-tap").textContent = "No taps yet today";

                updateUnsyncedBadge();

                if (critical) {
                    setCriticalSync(false);
                    setStatus("Ready for today ✓", "success");
                }

                isCriticalSync = false;
                scheduleMidnight();

                return true;
            }

            if (critical) {
                setCriticalSync(
                    true,
                    "Could not sync yet",
                    "Check Wi‑Fi. The app will retry automatically in 5 minutes."
                );

                setTimeout(() => {
                    runNewDayReset({
                        reason: "critical-retry",
                        critical: true
                    });
                }, CRITICAL_RETRY_MS);
            }

            return false;
        }

        // ─── MISSED MIDNIGHT DETECTION ───────────────────────────
        function primeLastResetDateIfNeeded() {
            if (localStorage.getItem("itLastResetDate")) {
                return;
            }

            localStorage.setItem("itLastResetDate", today());
        }

        function shouldCatchUpMissedMidnight() {
            const currentToday = today();
            const lastReset = localStorage.getItem("itLastResetDate");

            if (lastReset && lastReset !== currentToday) {
                return true;
            }

            if (!lastReset && log.length > 0) {
                return log.some(entry => entry.date !== currentToday);
            }

            return false;
        }

        async function checkMissedReset() {
            primeLastResetDateIfNeeded();

            if (!shouldCatchUpMissedMidnight()) {
                return false;
            }

            await runNewDayReset({
                reason: "missed-midnight",
                critical: true
            });

            return true;
        }

        document.addEventListener("visibilitychange", async () => {
            if (document.visibilityState !== "visible") {
                return;
            }

            const didReset = await checkMissedReset();

            if (!didReset && navigator.onLine && log.some(e => !e.pushed)) {
                await pushToSheet({
                    reason: "visible"
                });
            }
        });

        // ─── ONLINE INDICATOR ────────────────────────────────────
        function updateOnline() {
            document
                .getElementById("online-dot")
                .classList
                .toggle("offline", !navigator.onLine);
        }

        window.addEventListener("online", async () => {
            updateOnline();

            if (isCriticalSync) return;

            if (log.some(e => !e.pushed)) {
                await pushToSheet({
                    reason: "online"
                });
            }
        });

        window.addEventListener("offline", updateOnline);

        // ─── STATUS BAR ──────────────────────────────────────────
        function setStatus(msg, type) {
            const el = document.getElementById("status-bar");

            el.textContent = msg;
            el.className = type;

            if (type === "success") {
                setTimeout(() => {
                    el.textContent = "";
                    el.className = "";
                }, 4000);
            }
        }

        function setCriticalSync(open, title, message) {
            const overlay = document.getElementById("loading-overlay");
            const titleEl = document.getElementById("loading-title");
            const messageEl = document.getElementById("loading-message");

            if (title) {
                titleEl.textContent = title;
            }

            if (message) {
                messageEl.textContent = message;
            }

            overlay.classList.toggle("open", open);
            document.body.classList.toggle("app-locked", open);
            isCriticalSync = open;
        }

        // ─── CLOCK ───────────────────────────────────────────────
        function updateClock() {
            document.getElementById("clock").textContent =
                new Date().toLocaleTimeString("en-US", {
                    hour: "2-digit",
                    minute: "2-digit"
                });
        }

        // ─── INIT ────────────────────────────────────────────────
        async function init() {
            renderGrid();
            updateUnsyncedBadge();
            primeLastResetDateIfNeeded();
            updateClock();
            updateOnline();

            setInterval(updateClock, 30000);

            const didReset = await checkMissedReset();

            if (!didReset && navigator.onLine && log.some(e => !e.pushed)) {
                await pushToSheet({
                    reason: "startup"
                });
            }

            scheduleMidnight();
            startAutoSync();
        }

        init();
    </script>
</body>

</html>
